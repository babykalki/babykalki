<svg xmlns="http://www.w3.org/2000/svg" style="background:#0A0813" viewBox="0 0 420 980" role="img" aria-labelledby="dt dd" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="dt">BabyKalki architecture</title><desc id="dd">Path A (build it yourself with Claude Code): your laptop runs Claude Code on your Z.ai plan and deploys one container to Nimbuz. Inside the container a supervisor starts cloudflared, a safe static server for the public status page, dsh with six citizens on 127.0.0.1, the Library service and the backup cycle, over a /data folder that is copied to Cloudflare R2. Cloudflare carries traffic through an outbound tunnel to three names: www (public status page, fixed template, counts only), agent (private dashboard behind Cloudflare Access and the dsh login, plus the one-shot /bk-login helper), and hooks (planned public route for the WhatsApp webhook, bypasses Access, every request checked by Meta signature).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C6CFF"/></marker></defs><rect x="10" y="10" width="180" height="78" rx="10" fill="#181327" stroke="#3A2F58"/><text x="100.0" y="36.0" text-anchor="middle" font-weight="700" fill="#ECE8FA" font-size="14">Your laptop</text><text x="100.0" y="53.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">Claude Code + CLAUDE.md</text><text x="100.0" y="70.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">builds · deploys · updates</text><rect x="230" y="10" width="180" height="78" rx="10" fill="#181327" stroke="#3A2F58"/><text x="320.0" y="36.0" text-anchor="middle" font-weight="700" fill="#ECE8FA" font-size="14">Z.ai GLM Coding Plan</text><text x="320.0" y="53.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">glm-5.3 · glm-5.3-flash</text><text x="320.0" y="70.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">your personal plan</text><path d="M190 49 H228" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><text x="194" y="42" fill="#C9B8FF" font-size="11">model</text><path d="M100 88 V128" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><text x="108" y="113" fill="#C9B8FF" font-size="11">deploy (repo or zip)</text><rect x="10" y="130" width="400" height="470" rx="14" fill="#110E1D" stroke="#7C6CFF" stroke-width="1.4"/><text x="210" y="152" text-anchor="middle" fill="#C9B8FF" font-size="13" font-weight="700">Nimbuz — one container</text><rect x="24" y="164" width="372" height="46" rx="10" fill="#181327" stroke="#3A2F58"/><text x="210.0" y="182.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">bk_supervisor — starts everything · STOP switch</text><text x="210.0" y="199.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">infra runs as a separate user from the citizens</text><rect x="24" y="220" width="180" height="52" rx="10" fill="#181327" stroke="#3A2F58"/><text x="114.0" y="241.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">cloudflared</text><text x="114.0" y="258.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">tunnel · outbound only</text><rect x="216" y="220" width="180" height="52" rx="10" fill="#181327" stroke="#3A2F58"/><text x="306.0" y="241.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">bk_static :8080</text><text x="306.0" y="258.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">status page + /health</text><rect x="24" y="284" width="372" height="132" rx="10" fill="#181327" stroke="#4A3D6E"/><text x="210" y="304" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="700">dsh — 127.0.0.1:3080 (never 0.0.0.0)</text><rect x="32" y="314" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="89.0" y="330.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Warden</text><text x="89.0" y="347.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">front desk</text><rect x="154" y="314" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="211.0" y="330.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Librarian</text><text x="211.0" y="347.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">memory</text><rect x="276" y="314" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="333.0" y="330.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Reviewer</text><text x="333.0" y="347.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">checks</text><rect x="32" y="364" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="89.0" y="380.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Steward</text><text x="89.0" y="397.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">money · keys</text><rect x="154" y="364" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="211.0" y="380.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Builder</text><text x="211.0" y="397.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">code · content</text><rect x="276" y="364" width="114" height="42" rx="8" fill="#201A33" stroke="#4A3D6E"/><text x="333.0" y="380.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Scout</text><text x="333.0" y="397.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">research</text><rect x="24" y="428" width="372" height="52" rx="10" fill="#181327" stroke="#3A2F58"/><text x="210.0" y="449.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">Library service — the only writer</text><text x="210.0" y="466.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">LadybugDB · recall · propose_fact · tasks · approvals</text><rect x="24" y="490" width="372" height="52" rx="10" fill="#0d0b18" stroke="#3A2F58" stroke-dasharray="5 4"/><text x="210.0" y="511.5" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">/data</text><text x="210.0" y="528.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">library · diary · cards · site · backups (copied to R2)</text><text x="210" y="562" text-anchor="middle" fill="#B3ABD0" font-size="11">connects to: GitHub · Gmail · Calendar · Drive · Telegram</text><text x="210" y="580" text-anchor="middle" fill="#B3ABD0" font-size="11">Kling · Runway · Razorpay/Stripe (read-only) — narrow scopes</text><path d="M396 356 H415 V100 H380 V90" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><path d="M210 600 V628" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><text x="218" y="618" fill="#C9B8FF" font-size="11">tunnel (outbound)</text><rect x="10" y="630" width="400" height="70" rx="10" fill="#181327" stroke="#3A2F58"/><text x="210.0" y="652.0" text-anchor="middle" font-weight="700" fill="#ECE8FA" font-size="14">Cloudflare</text><text x="210.0" y="669.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">domain · Tunnel · Zero Trust Access (email code / Google)</text><text x="210.0" y="686.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">R2: off-site copies of /data</text><path d="M210 700 V720" fill="none" stroke="#7C6CFF" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/><rect x="70" y="722" width="280" height="62" rx="10" fill="#181327" stroke="#E8B339" stroke-dasharray="5 4"/><text x="210.0" y="740.0" text-anchor="middle" fill="#E8B339" font-size="11.5" font-weight="600">hooks.yourdomain — planned</text><text x="210.0" y="757.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">WhatsApp webhook · bypasses Access</text><text x="210.0" y="774.0" text-anchor="middle" fill="#B3ABD0" font-size="11.5">Meta signature checked · not in v0.4</text><path d="M30 700 V804" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><path d="M390 700 V804" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="806" width="196" height="96" rx="10" fill="#181327" stroke="#3A2F58"/><text x="108.0" y="832.5" text-anchor="middle" font-weight="700" fill="#ECE8FA" font-size="14">www.yourdomain</text><text x="108.0" y="849.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">public status page</text><text x="108.0" y="866.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">fixed template,</text><text x="108.0" y="883.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">counts only</text><rect x="214" y="806" width="196" height="96" rx="10" fill="#181327" stroke="#E8B339"/><text x="312.0" y="832.5" text-anchor="middle" font-weight="700" fill="#ECE8FA" font-size="14">agent.yourdomain</text><text x="312.0" y="849.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">private dashboard (dsh)</text><text x="312.0" y="866.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">2 locks: Access + dsh login</text><text x="312.0" y="883.5" text-anchor="middle" fill="#B3ABD0" font-size="11.5">/bk-login: one-shot link</text><rect x="110" y="926" width="200" height="42" rx="10" fill="#0f1f1a" stroke="#4BD6A1"/><text x="210.0" y="951.0" text-anchor="middle" fill="#ECE8FA" font-size="12.5" font-weight="600">You — phone or browser</text><path d="M170 926 L120 904" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/><path d="M250 926 L300 904" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#ah)"/></svg>